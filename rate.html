<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Rate DJ — Kryss.pl</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0b;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.box {
  background: #121212;
  padding: 30px;
  border-radius: 15px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 0 20px rgba(0,0,0,.6);
}

h1 {
  text-align: center;
}

.stars {
  display: flex;
  justify-content: center;
  font-size: 2.5rem;
  cursor: pointer;
  gap: 5px;
}

.star {
  color: #444;
  transition: .2s;
}

.star.active {
  color: #f5c542;
}

input, textarea {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-family: Arial, sans-serif;
}

textarea {
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  border: none;
  border-radius: 25px;
  background: #1db955;
  font-size: 1rem;
  cursor: pointer;
  color: #fff;
}

button:hover {
  background: #17a84a;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  text-align: center;
  margin-top: 10px;
  font-size: .9rem;
}
</style>
</head>

<body>

<div class="box">
  <h1>Oceń DJ-a</h1>

  <div class="stars">
    <span class="star">★</span>
    <span class="star">★</span>
    <span class="star">★</span>
    <span class="star">★</span>
    <span class="star">★</span>
  </div>

  <input id="email" type="email" placeholder="Email (opcjonalnie – kontakt zwrotny)">
  <textarea id="comment" rows="4" placeholder="Komentarz (opcjonalnie)"></textarea>

  <button id="submitBtn" onclick="sendRate()">Wyślij ocenę</button>
  <div class="status" id="status"></div>
</div>

<script>
const WORKER_URL = "misty-mode-f671.pietraskrystian09.workers.dev";

let rating = 0;

const stars = document.querySelectorAll(".star");
const emailEl = document.getElementById("email");
const commentEl = document.getElementById("comment");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");

stars.forEach((star, i) => {
  star.onclick = () => {
    rating = i + 1;

    stars.forEach((s, j) => {
      s.classList.toggle("active", j <= i);
    });
  };
});

function status(text) {
  statusEl.innerText = text;
}

async function sendRate() {
  if (!rating) {
    status("Wybierz ilość gwiazdek!");
    return;
  }

  if (emailEl.value && !emailEl.checkValidity()) {
    status("Podaj poprawny adres email.");
    return;
  }

  submitBtn.disabled = true;
  status("Wysyłanie oceny...");

  const message = [
    "⭐ **NOWA OCENA DJ-A**",
    "",
    `**Ocena:** ${"⭐".repeat(rating)} (${rating}/5)`,
    `**Komentarz:** ${commentEl.value.trim() || "Brak"}`,
    `**Email (kontakt):** ${emailEl.value.trim() || "Nie podano"}`,
    "",
    "━━━━━━━━━━━━━━━━",
    "🌐 kryss.pl/rate"
  ].join("\n");

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error("Wysyłanie nie powiodło się");
    }

    status("Dzięki za ocenę! ❤️");

    rating = 0;
    stars.forEach(s => s.classList.remove("active"));

    commentEl.value = "";
    emailEl.value = "";

  } catch (error) {
    console.error(error);
    status("Błąd wysyłania oceny. Spróbuj ponownie.");
  } finally {
    submitBtn.disabled = false;
  }
}
</script>

</body>
</html>
